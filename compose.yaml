services:
  postgres:
    image: postgres:16-alpine
    container_name: research_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_engine"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
