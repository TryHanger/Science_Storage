[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.1.0"
description = "Research Engine MVP v0.1 — Systematic screening engine with OpenAlex, PostgreSQL and AI review packets"
requires-python = ">=3.11"
authors = [
    { name = "Nikita" }
]
dependencies = [
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
research = "research_engine.cli:app"

[tool.setuptools.packages.find]
include = ["research_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
